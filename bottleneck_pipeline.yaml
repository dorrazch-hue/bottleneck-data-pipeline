id: bottleneck_pipeline
namespace: bottleneck

triggers:
  - id: declenchement_mensuel
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *"

errors:
  - id: alerte_echec_pipeline
    type: io.kestra.plugin.core.log.Log
    message: "Échec du pipeline BottleNeck (exécution {{ execution.id }}, tâche : {{ task.id }}) — intervention de l'équipe Data nécessaire."
    level: ERROR

tasks:
  - id: nettoyage_parallele
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: branche_erp
        type: io.kestra.plugin.core.flow.WorkingDirectory
        namespaceFiles:
          enabled: true
        tasks:
          - id: nettoyage_erp
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/nettoyage_erp.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S
          - id: test_erp
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/test_erp.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S

      - id: branche_web
        type: io.kestra.plugin.core.flow.WorkingDirectory
        namespaceFiles:
          enabled: true
        tasks:
          - id: nettoyage_web
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/nettoyage_web.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S
          - id: test_web
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/test_web.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S

      - id: branche_liaison
        type: io.kestra.plugin.core.flow.WorkingDirectory
        namespaceFiles:
          enabled: true
        tasks:
          - id: nettoyage_liaison
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/nettoyage_liaison.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S
          - id: test_liaison
            type: io.kestra.plugin.jdbc.duckdb.Queries
            sql: "{{ read('scripts/test_liaison.sql') }}"
            fetchType: FETCH
            retry:
              type: constant
              maxAttempt: 3
              interval: PT10S

  - id: pipeline_suite
    type: io.kestra.plugin.core.flow.WorkingDirectory
    namespaceFiles:
      enabled: true
    tasks:
      - id: jointure
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/jointure.sql') }}"
        fetchType: FETCH
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: test_jointure
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/test_jointure.sql') }}"
        fetchType: FETCH
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: calcul_ca
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/calcul_ca.sql') }}"
        fetchType: FETCH
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: test_ca
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/test_ca.sql') }}"
        fetchType: FETCH
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: zscore
        type: io.kestra.plugin.scripts.python.Script
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: "{{ read('scripts/zscore_vins.py') }}"
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: test_zscore
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/test_zscore.sql') }}"
        fetchType: FETCH
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: extraction_rapport_ca
        type: io.kestra.plugin.jdbc.duckdb.Queries
        sql: "{{ read('scripts/extraction_rapport_ca.sql') }}"
        fetchType: FETCH
        outputFiles:
          - rapport_ca_bottleneck.xlsx
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

  - id: comptage_premium
    type: io.kestra.plugin.jdbc.duckdb.Queries
    sql: "{{ read('scripts/comptage_premium.sql') }}"
    fetchType: FETCH
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: verification_premium_existe
    type: io.kestra.plugin.jdbc.duckdb.Queries
    sql: "{{ read('scripts/verification_premium_existe.sql') }}"
    fetchType: FETCH
    allowFailure: true
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: routage_extraction_vins
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ tasks.verification_premium_existe.state == 'SUCCESS' }}"
    cases:
      "true":
        - id: extraction_vins_premium
          type: io.kestra.plugin.jdbc.duckdb.Queries
          sql: "{{ read('scripts/extraction_vins_premium.sql') }}"
          fetchType: FETCH
          outputFiles:
            - vins_premium_final.csv
          retry:
            type: constant
            maxAttempt: 3
            interval: PT10S
        - id: extraction_vins_ordinaires
          type: io.kestra.plugin.jdbc.duckdb.Queries
          sql: "{{ read('scripts/extraction_vins_ordinaires.sql') }}"
          fetchType: FETCH
          outputFiles:
            - vins_ordinaires_final.csv
          retry:
            type: constant
            maxAttempt: 3
            interval: PT10S
      "false":
        - id: extraction_vins_ordinaires_seule
          type: io.kestra.plugin.jdbc.duckdb.Queries
          sql: "{{ read('scripts/extraction_vins_ordinaires.sql') }}"
          fetchType: FETCH
          outputFiles:
            - vins_ordinaires_final.csv
          retry:
            type: constant
            maxAttempt: 3
            interval: PT10S
        - id: alerte_aucun_premium
          type: io.kestra.plugin.core.log.Log
          message: "Aucun vin premium détecté ce mois-ci (z-score > 2) — comptage_premium a renvoyé 0."
          level: WARN
